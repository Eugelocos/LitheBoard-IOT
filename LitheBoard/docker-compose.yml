networks:
  litheboard-network:
    driver: bridge
 
services:
  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: litheboard-frontend
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend:delegated
      - /app/frontend/node_modules
    ports:
      - "3000:3000" # Public Web
      - "3010:3010" # WebSocket
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
     - litheboard-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: litheboard-backend
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
    ports:
      - "3001:3001" # API
      - "3007:3007" # WebSocket
    networks:
      - litheboard-network
    depends_on:
      mysql:
        condition: service_healthy

  # EMQX Broker
  emqx:
    image: emqx:latest
    container_name: litheboard-emqx
    ports:
      - "18083:18083"
      - "1883:1883"
    environment:
      - EMQX_NODE_NAME=emqx@node1.local
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=admin123
      # 1. Desactiva conexiones anónimas
      - EMQX_ALLOW_ANONYMOUS=false
      # 2. Define el mecanismo de autenticación (Password-Based / Built-in Database)
      - EMQX_AUTHENTICATION__1__MECHANISM=password_based
      - EMQX_AUTHENTICATION__1__BACKEND=built_in_database
      - EMQX_AUTHENTICATION__1__USER_TYPE=username
      # 3. Usuario por defecto
      - EMQX_AUTHENTICATION__1__USERS__1__USERNAME=admin
      - EMQX_AUTHENTICATION__1__USERS__1__PASSWORD=admin123
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - litheboard-network

  # MySQL Database
  mysql:
    image: mysql:8.0.23
    container_name: litheboard-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: litheboard_db
      MYSQL_USER: litheboard_user
      MYSQL_PASSWORD: securepassword
    ports:
      - "3306:3306"
    networks:
      - litheboard-network
    volumes:
      - ./db/data:/var/lib/mysql
      - ./db/dump.sql:/docker-entrypoint-initdb.d/dump.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s